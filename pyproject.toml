[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superdrive-helper"
version = "0.1.0"
description = "A PySide6 helper for Apple USB SuperDrive devices on Linux."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["PySide6>=6.5", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6"]

[project.scripts]
superdrive-helper = "superdrive.gui.main_window:main"
superdrive-cli = "superdrive.cli:main"

[tool.setuptools.packages.find]
include = ["superdrive*"]

[tool.setuptools.package-data]
"superdrive.gui.theme" = ["style.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
